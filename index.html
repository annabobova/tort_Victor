<!DOCTYPE html>
<html lang="EN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Birthday Cake 🎂</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      #mainTitle {
        font-size: 32px;
        font-family: 'Pixelify Sans', sans-serif;
        margin-bottom: 8px;
      }

      #subTitle {
        font-size: 18px;
        font-family: 'Pixelify Sans', sans-serif;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="birthdayText"></div>
      <div class="cake-container">
        <div class="cake" id="cake"></div>
      </div>
    </div>

    <script>
      // Read URL params
      const params = new URLSearchParams(window.location.search);
      const name = params.get("name") || "Friend";
      let candleCount = parseInt(params.get("candles")) || 10;
      candleCount = Math.min(Math.max(candleCount, 1), 30);

      const birthdayText = document.getElementById("birthdayText");
      birthdayText.innerHTML = `
        <div id="mainTitle">Joyeux anniversaire, Викторчик!</div>
        <div id="subTitle">Tu dois faire un voeu et souffler les bougies.</div>
      `;

      const cake = document.getElementById("cake");

      const colors = [
        "blue-candle",
        "rose-candle",
      ];
      const CAKE_VISUAL_WIDTH = 50;

      function createCandles(count) {
        cake.innerHTML = "";
        const CANDLE_VISUAL_WIDTH = 1;
        const availableWidth = CAKE_VISUAL_WIDTH;
        const candlesPerRow = 5;
        const rowCount = Math.ceil(count / candlesPerRow);
        const shiftAmount = 2;

        for (let i = 0; i < count; i++) {
        const candle = document.createElement("div");
        candle.classList.add("candle");
        const colorClass = colors[Math.floor(Math.random() * colors.length)];
        candle.classList.add(colorClass);

        // On calcule les rangées pour éviter qu'elles soient toutes sur une seule ligne
        const row = Math.floor(i / 5); 
        const col = i % 5;

        candle.style.position = "absolute";
        
        // Écart horizontal (col * 8) et vertical (row * 5)
        // Le "-20" et "+75" servent à centrer le groupe sur le gâteau
        candle.style.top = `${row * 2 - 40}px`; 
        candle.style.left = `${col * 25 + 25}px`;

        cake.appendChild(candle);
      }
      }

      createCandles(candleCount);

// === Microphone / Blow Detection ===
      async function startMicDetection() {
        // Pour les navigateurs modernes, l'AudioContext doit souvent être repris après un clic
        const startAudio = async () => {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            const analyser = audioContext.createAnalyser();
            analyser.fftSize = 256; // Plus petit pour plus de réactivité

            source.connect(analyser);
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            let blown = false;

            function detectBlow() {
              if (blown) return; // Arrête de calculer si c'est déjà soufflé

              analyser.getByteFrequencyData(dataArray);
              
              // On calcule le volume moyen (RMS simplifié)
              let sum = 0;
              for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
              }
              let average = sum / dataArray.length;

              // SEUIL DE DÉTECTION : 
              // 40-50 est sensible. Si ça s'éteint tout seul, monte à 60.
              if (average > 50) { 
                blown = true;
                blowOutCandles();
              }
              requestAnimationFrame(detectBlow);
            }
            detectBlow();
          } catch (err) {
            console.error("Mic access error:", err);
          }
        };

        // On lance la détection au premier clic/touche sur l'écran
        window.addEventListener('click', startAudio, { once: true });
        window.addEventListener('touchstart', startAudio, { once: true });
      }

      function blowOutCandles() {
        const candles = document.querySelectorAll(".candle");
        candles.forEach((candle) => {
          const delay = Math.random() * 800; // Un peu plus rapide
          setTimeout(() => {
            // ÉTAPE CRUCIALE : On enlève l'animation de feu et on met celle de l'extinction
            candle.style.animation = "none"; 
            candle.offsetHeight; // Force le recalcul du navigateur
            candle.classList.add("blown");
          }, delay);
        });

        setTimeout(() => {
          const subTitle = document.getElementById("subTitle");
          subTitle.textContent = `Youhooo!! On va fêter ça ensemble!! 🎉`;
        }, 1200);
      }

    

    
      startMicDetection();
    </script>
  </body>
</html>
